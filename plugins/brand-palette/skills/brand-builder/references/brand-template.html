<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
__FONTS__
<style>
/* Generated tokens: the page is styled with the same values it documents. */
/*__TOKENS__*/
</style>
<style>
/* Layout: one 1120px reading column, sticky section nav, each section = header + live specimens
   drawn with the brand's own tokens. Every color below is a token, so the theme toggle flips it all. */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--page); color: var(--text); font: 16px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1, h2 { font-family: var(--font-display); font-weight: 600; }
h2 { font-size: clamp(1.5rem, 3vw, 1.85rem); }
h3 { font-size: 1.1rem; font-weight: 600; }
h4 { font-size: 1rem; font-weight: 600; }
p { margin: 0; max-width: 66ch; }
code, .mono { font-family: var(--mono); font-size: .88em; }
code { background: var(--raised); padding: .1em .35em; border-radius: 4px; overflow-wrap: anywhere; }
a { color: var(--primary-text); }
:focus-visible { outline: 2px solid var(--primary-text); outline-offset: 2px; }
.eyebrow { font: 500 .72rem/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
.lede { color: var(--text-muted); font-size: 1.05rem; }
.cap { color: var(--text-muted); font-size: .85rem; }

/* nav */
nav.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--page) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--divider); }
nav.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 8px; }
nav.top .links { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
nav.top .links a { flex: none; color: var(--text-muted); text-decoration: none; font-size: .85rem; padding: 5px 10px; border-radius: 999px; }
nav.top .links a:hover { color: var(--text); background: var(--raised); }
.theme { flex: none; display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.theme button { font: .78rem var(--font); background: none; border: 0; color: var(--text-muted); padding: 4px 10px; cursor: pointer; }
.theme button[aria-pressed="true"] { background: var(--primary-surface); color: var(--primary-text); font-weight: 600; }

/* hero */
header.hero { padding-block: 56px 44px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 36px; align-items: center; }
.hero-copy { display: grid; gap: 18px; min-width: 0; }
.kicker { font-family: var(--mono); color: var(--text-muted); font-size: .85rem; }
.hero h1 { font-size: clamp(2.6rem, 6vw, 4rem); letter-spacing: -.02em; }
.hero h1 span { color: var(--primary-text); }
.stats { display: flex; flex-wrap: wrap; gap: 10px 32px; padding-top: 20px; border-top: 1px solid var(--divider); }
.stat b { display: block; font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--text-muted); font-size: .82rem; }
.art { border-radius: 16px; overflow: hidden; aspect-ratio: 5 / 4; background: var(--surface); border: 1px solid var(--divider); }
.art svg { display: block; width: 100%; height: 100%; }

section { padding-block: 52px; border-top: 1px solid var(--divider); display: grid; gap: 24px; scroll-margin-top: 50px; }
section > header { display: grid; gap: 10px; }
.frame { background: var(--surface); border: 1px solid var(--divider); border-radius: 14px; padding: 20px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.cols2, .cols3, .cols4 { display: grid; gap: 18px; }
.cols2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* brand */
.motif { display: grid; gap: 10px; align-content: start; padding: 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--divider); min-width: 0; }
.motif .glyph { height: 44px; display: flex; align-items: center; }
.motif p { font-size: .9rem; color: var(--text-muted); }
.motif .role { font: 500 .78rem var(--mono); }
.voice { display: flex; flex-wrap: wrap; gap: 8px; }
.voice span { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: .9rem; }
.voice span.no { color: var(--text-muted); text-decoration: line-through; text-decoration-color: var(--error); }
dl.names, dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; font-size: .92rem; margin: 0; }
dl dt { color: var(--text-muted); }
dl.facts dt { font-family: var(--mono); font-size: .82rem; }
dl dd { margin: 0; min-width: 0; }

/* swatches */
button.sw { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 6px; min-width: 0; border-radius: 10px; align-content: start; }
button.sw:focus-visible { outline: 2px solid var(--primary-text); outline-offset: 3px; }
.chip-c { height: 64px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--text) 12%, transparent); display: flex; align-items: flex-end; padding: 8px; font: 500 .8rem var(--mono); }
.sw .nm { font-size: .88rem; font-weight: 600; }
.sw .hx { font: .76rem var(--mono); color: var(--text-muted); }
.sw .use { font-size: .8rem; color: var(--text-muted); }
.neutrals { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; }
.brand-card { display: grid; gap: 14px; padding: 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--divider); min-width: 0; align-content: start; }
.brand-card .hdr { display: grid; gap: 2px; }
.brand-card .hdr .use { color: var(--text-muted); font-size: .88rem; }
.big { height: 92px; border-radius: 10px; display: flex; align-items: flex-end; justify-content: space-between; padding: 10px 12px; font-weight: 600; }
.big .r { font: 500 .78rem var(--mono); }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.steps .chip-c { height: 44px; }
.rule { font-size: .84rem; color: var(--text-muted); border-top: 1px solid var(--divider); padding-top: 10px; }

/* contrast table */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--divider); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--divider); vertical-align: middle; white-space: nowrap; }
th { font: 500 .72rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); background: var(--surface); }
tr:last-child td { border-bottom: 0; }
.pair { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; padding: 3px 8px; border-radius: 6px; font-weight: 600; font-size: .85rem; box-shadow: inset 0 0 0 1px rgb(127 127 127 / .25); }
.ratio { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: .82rem; margin: 0 6px; }
.badge { display: inline-block; font: 500 .7rem var(--mono); padding: 2px 8px; border-radius: 999px; border: 1px solid; }
.badge.aaa { color: var(--primary-text); border-color: var(--primary-text); background: var(--primary-surface); }
.badge.aa { color: var(--data-text); border-color: var(--data-text); background: var(--data-surface); }
.badge.ui { color: var(--text-muted); border-color: var(--line); background: var(--raised); }
.badge.no { color: var(--error-strong); border-color: var(--error); background: var(--error-surface); }

/* charts */
.ramp { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.ramp .chip-c { height: 56px; border-radius: 6px; justify-content: center; align-items: center; }
.ramp .hx { text-align: center; font-size: .66rem; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 150px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.bars span { flex: 1; border-radius: 4px 4px 0 0; background: var(--ramp-dim); min-width: 0; }
.bars span.sel { background: var(--chart-sel); }
.bar-x { display: flex; gap: 8px; font: .7rem var(--mono); color: var(--text-muted); }
.bar-x span { flex: 1; text-align: center; min-width: 0; }
.heat { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; }
.heat i { aspect-ratio: 1; border-radius: 2px; display: block; }
.legend-row { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .88rem; color: var(--text-muted); align-items: center; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; }
ul.list { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: .92rem; }
ul.list li::marker { color: var(--text-muted); }

/* signature */
.verdict { font: 600 .78rem var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.verdict.ok { color: var(--primary-text); }
.verdict.bad { color: var(--error-strong); }
pre { margin: 0; overflow-x: auto; background: var(--page); border: 1px solid var(--divider); border-radius: 10px; padding: 14px 16px; font: .82rem/1.6 var(--mono); color: var(--text); }

/* type */
.font-card { display: grid; gap: 10px; padding: 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--divider); min-width: 0; align-content: start; }
.font-card .spec { font-size: 2.4rem; line-height: 1.05; overflow-wrap: anywhere; }
.font-card .chars { color: var(--text-muted); overflow-wrap: anywhere; }
.scale { display: grid; border: 1px solid var(--divider); border-radius: 14px; overflow: hidden; }
.srow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 18px; align-items: baseline; padding: 14px 18px; border-bottom: 1px solid var(--divider); }
.srow:last-child { border-bottom: 0; }
.srow .lbl { display: grid; gap: 2px; font-size: .82rem; color: var(--text-muted); }
.srow .lbl b { color: var(--text); font-weight: 600; font-size: .88rem; }
.srow .lbl span { font-family: var(--mono); font-size: .74rem; }
.srow .ex { min-width: 0; overflow-wrap: anywhere; }

/* layout */
.sp { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 12px; align-items: center; font: .8rem var(--mono); color: var(--text-muted); }
.sp i { display: block; height: 12px; border-radius: 3px; background: var(--primary-soft); max-width: 100%; }
.shell { display: grid; height: 220px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font: .72rem var(--mono); color: var(--text-muted); background: var(--page); }
.shell.sidebar { grid-template-columns: 28% minmax(0, 1fr); }
.shell.site { grid-template-rows: 34px minmax(0, 1fr); }
.shell .sb { background: var(--surface); padding: 14px 10px; display: grid; gap: 6px; align-content: start; border-right: 1px solid var(--divider); }
.shell .tb { background: var(--surface); border-bottom: 1px solid var(--divider); display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.shell .tb i { width: 36px; height: 8px; border-radius: 4px; background: var(--raised); display: block; }
.shell .tb i.on { background: var(--primary); }
.shell .sb i { display: block; height: 14px; border-radius: 4px; background: var(--raised); }
.shell .sb i.on { background: var(--primary-soft); }
.shell .mn { padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.shell .grid12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; height: 100px; }
.shell .grid12 i { background: var(--primary-surface); border: 1px dashed var(--primary-soft); border-radius: 2px; display: block; }
.shell .mn .h { height: 16px; width: 55%; border-radius: 4px; background: var(--line); }

/* components */
.specimen { display: grid; gap: 12px; align-content: start; padding: 18px; border-radius: 12px; background: var(--page); border: 1px solid var(--divider); min-width: 0; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: 600 .9rem var(--font); border-radius: var(--radius); padding: 8px 16px; cursor: pointer; border: 1px solid transparent; }
.btn.primary { background: var(--primary-fill); color: var(--on-primary); }
.btn.primary:hover { filter: brightness(1.08) saturate(1.05); }
.btn.secondary { background: transparent; color: var(--primary-text); border-color: var(--primary-text); }
.btn.secondary:hover { background: var(--primary-surface); }
.btn.accent { background: var(--accent-fill); color: var(--on-accent); }
.btn.accent:hover { filter: brightness(1.05); }
.btn.danger { background: transparent; color: var(--error-strong); border-color: var(--error); }
.btn:disabled { background: var(--raised); color: var(--text-muted); border-color: var(--divider); cursor: not-allowed; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.kpiLabel { font-size: .875rem; color: var(--text-muted); }
.kpiValue { font-size: 2.1rem; line-height: 1.25; font-variant-numeric: tabular-nums; }
.delta { display: inline-block; margin-top: 4px; padding: 0 8px; border-radius: 999px; font-size: .8rem; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--primary-text); background: var(--primary-surface); }
.delta.down { color: var(--error-strong); background: var(--error-surface); }
.tabList { display: flex; gap: 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { background: none; border: none; padding: 8px 0; cursor: pointer; color: var(--text); border-bottom: 2px solid transparent; margin-bottom: -1px; font: inherit; }
.tab[aria-selected="true"] { color: var(--primary-text); border-bottom-color: var(--primary-text); font-weight: 600; }
.segmented { display: inline-flex; width: fit-content; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.segment { background: none; border: none; padding: 4px 16px; cursor: pointer; font: inherit; font-size: .9rem; color: var(--text); }
.segment + .segment { border-left: 1px solid var(--line); }
.segment[aria-pressed="true"] { color: var(--primary-text); background: var(--primary-surface); font-weight: 600; }
.field { display: grid; gap: 6px; }
.field label { font-size: .88rem; font-weight: 600; }
.field input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--text-muted); border-radius: var(--radius); padding: 8px 12px; }
.field input::placeholder { color: var(--text-muted); }
.field input:focus { outline: 2px solid var(--primary-text); outline-offset: 2px; }
.field.bad input { border-color: var(--error); }
.field .help { font-size: .82rem; color: var(--text-muted); }
.field.bad .help { color: var(--error-strong); }
.notice { padding: 12px 16px; border-radius: var(--radius); font-size: .95rem; }
.notice.info { background: var(--data-surface); color: var(--data-text); }
.notice.highlight { background: var(--accent-fill); color: var(--on-accent); }
.notice.error { background: var(--error-surface); color: var(--error-strong); }
.rows { display: grid; font-size: .9rem; border: 1px solid var(--divider); border-radius: 10px; overflow: hidden; }
.rows div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--divider); background: var(--surface); }
.rows div:last-child { border-bottom: 0; }
.rows .hover { background: var(--raised); }
.rows .selected { background: var(--primary-surface); box-shadow: inset 3px 0 0 var(--primary); }
.rows span:last-child { color: var(--text-muted); font-size: .8rem; font-family: var(--mono); }
.progress { display: flex; align-items: center; gap: 12px; font-size: .85rem; font-variant-numeric: tabular-nums; }
.progress .bar { flex: 1; height: 6px; min-width: 60px; background: var(--data-soft); border-radius: 3px; overflow: hidden; }
.progress .bar > span { display: block; height: 100%; background: var(--chart-sel); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .8rem; padding: 2px 10px; border-radius: 999px; color: var(--text); }

/* files */
.file { display: grid; gap: 6px; padding: 14px; border-radius: 12px; background: var(--page); border: 1px solid var(--line); min-width: 0; align-content: start; }
.file .path { font: 500 .8rem var(--mono); color: var(--primary-text); overflow-wrap: anywhere; }
.file p { font-size: .86rem; color: var(--text-muted); }
.guard { display: grid; gap: 8px; border: 1.5px solid var(--primary); background: var(--primary-surface); border-radius: 14px; padding: 18px; }
.copybar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--page); padding: 8px 14px; border-radius: 999px; font: .85rem var(--mono); z-index: 20; }
footer { padding-block: 32px 56px; border-top: 1px solid var(--divider); color: var(--text-muted); font-size: .82rem; }

@media (max-width: 900px) {
  header.hero { grid-template-columns: minmax(0, 1fr); }
  .art { max-width: 520px; }
  .cols4, .cols3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .neutrals { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .cols2, .cols3, .cols4, .kpis { grid-template-columns: minmax(0, 1fr); }
  .neutrals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ramp { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .srow { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .heat { gap: 1px; }
}
</style>

<body>
<nav class="top" aria-label="Sections">
  <div class="wrap">
    <div class="links" id="navlinks"></div>
    <div class="theme" role="group" aria-label="Color theme">
      <button type="button" data-set="auto">Auto</button><button type="button" data-set="light">Light</button><button type="button" data-set="dark">Dark</button>
    </div>
  </div>
</nav>
<main class="wrap" id="main"></main>
<footer><div class="wrap" id="foot"></div></footer>
<div class="toast" id="toast" role="status" hidden></div>

<script id="brand-data" type="application/json">__DATA__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('brand-data').textContent);
  var S = D.spec, R = D.roles;
  var root = document.documentElement;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var main = document.getElementById('main');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function h(tag, cls, inner) { var e = el(tag, cls); e.innerHTML = inner; return e; }
  // Text that differs by mode: both values ride on the element and applyMode() picks one.
  function md(tag, cls, light, dark) { var e = el(tag, cls); e.setAttribute('data-light', light); e.setAttribute('data-dark', dark); return e; }
  function mode() { return root.getAttribute('data-theme') || (mq.matches ? 'dark' : 'light'); }
  function applyMode() {
    var m = mode();
    document.querySelectorAll('[data-light]').forEach(function (e) { e.textContent = e.getAttribute('data-' + m); });
    document.querySelectorAll('[data-on-light]').forEach(function (e) { e.style.color = e.getAttribute('data-on-' + m); });
    var set = root.getAttribute('data-theme') || 'auto';
    document.querySelectorAll('.theme button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-set') === set ? 'true' : 'false'); });
  }
  var toastTimer;
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 1400); }
  function copy(text, label) {
    try { navigator.clipboard.writeText(text).then(function () { toast('Copied ' + label); }, function () { toast(text); }); } catch (e) { toast(text); }
  }
  // A swatch for a token: shows the active mode's hex and copies it.
  function sw(token, values, name, use, chipText) {
    var b = el('button', 'sw'); b.type = 'button';
    var chip = el('div', 'chip-c'); chip.style.background = 'var(--' + token + ')';
    if (chipText) { chip.textContent = chipText; }
    b.appendChild(chip);
    if (name) b.appendChild(el('span', 'nm', name));
    b.appendChild(md('span', 'hx', values.light, values.dark));
    if (use) b.appendChild(el('span', 'use', use));
    b.setAttribute('aria-label', 'Copy ' + (name || token));
    b.addEventListener('click', function () { var v = values[mode()]; copy(v, v); });
    return b;
  }
  function section(id, n, eyebrow, title, lede) {
    var s = el('section'); s.id = id;
    var hd = el('header');
    hd.appendChild(el('div', 'eyebrow', n + ' · ' + eyebrow));
    hd.appendChild(el('h2', null, title));
    if (lede) hd.appendChild(h('p', 'lede', lede));
    s.appendChild(hd);
    main.appendChild(s);
    return s;
  }
  function list(items) { var u = el('ul', 'list'); items.forEach(function (t) { u.appendChild(h('li', null, t)); }); return u; }
  function frame(title, child) { var f = el('div', 'frame'); if (title) f.appendChild(el('h3', null, title)); if (child) f.appendChild(child); return f; }
  var byKey = {}; D.brands.forEach(function (b) { byKey[b.key] = b; });

  // ---------- hero ----------
  var hero = el('header', 'hero');
  var copyCol = el('div', 'hero-copy');
  if (S.kicker) copyCol.appendChild(el('div', 'kicker', S.kicker));
  var h1 = el('h1');
  var accent = S.title_accent && S.name.indexOf(S.title_accent) >= 0 ? S.title_accent : '';
  if (accent) {
    var i = S.name.indexOf(accent);
    h1.appendChild(document.createTextNode(S.name.slice(0, i)));
    h1.appendChild(el('span', null, accent));

  document.querySelectorAll('.theme button').forEach(function (b) { b.addEventListener('click', function () { setTheme(b.getAttribute('data-set')); }); });
  if (mq.addEventListener) mq.addEventListener('change', applyMode);
  applyMode();
})();
</script>
</body>
</html>
